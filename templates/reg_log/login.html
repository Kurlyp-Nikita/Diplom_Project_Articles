{% extends "index.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-form-container">
  <div class="auth-form-title">Вход</div>
  
  <form method="post" class="auth-form login-form">
    {% csrf_token %}
    
    <div class="form-group">
      <label for="id_username">Имя пользователя:</label>
      <input type="text" name="username" id="id_username" class="form-control" required autocomplete="username" autofocus>
      <i class="fas fa-user"></i>
    </div>
    
    <div class="form-group">
      <label for="id_password">Пароль:</label>
      <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password">
      <i class="fas fa-lock"></i>
    </div>
    
    {% if form.errors %}
    <div class="auth-error">
      <i class="fas fa-exclamation-circle"></i>
      Неверное имя пользователя или пароль.
    </div>
    {% endif %}
    
    <button type="submit" class="auth-submit-btn">
      <i class="fas fa-sign-in-alt"></i> Войти
    </button>
  </form>
  
  <div class="auth-links">
    <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}
